[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "fm-dlp"
version = "4.9.0"
description = "CLI tool for searching YouTube/YTMusic and downloading audio/video from 1000+ sites"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Fkernel653" }]
keywords = [
    "cli",
    "youtube",
    "ytmusicapi",
    "youtube-music",
    "yt-dlp",
    "yt-dlp-wrapper",
    "ffmpeg",
    "agplv3",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

dependencies = ["yt-dlp", "ytmusicapi", "mutagen"]

[project.optional-dependencies]
dev = ["ruff", "uv", "pyinstaller", "pystrip"]

[tool.ruff.lint]
ignore = ["BLE001"]

[project.urls]
Homepage = "https://github.com/Fkernel653/fm-dlp"
Repository = "https://github.com/Fkernel653/fm-dlp.git"
Documentation = "https://github.com/Fkernel653/fm-dlp#readme"

[project.scripts]
fm-dlp = "fm_dlp.cli.cli:main"

[tool.uv.build-backend]
module-root = ""
